  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#accent)">Space Hopper</text>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#CBD5E1">Hop among the stars</text>
